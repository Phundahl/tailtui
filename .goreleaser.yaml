version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{.Version}} -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Listing `files` replaces goreleaser's defaults, so LICENSE and README
    # have to be restated alongside the template.
    files:
      - LICENSE
      - README.md
      - contrib/tailtui.toml.tpl

# nfpm builds official .deb (Debian/Ubuntu) and .rpm (Fedora/RedHat) packages
nfpms:
  - id: tailtui-packages
    homepage: https://github.com/Phundahl/tailtui
    maintainer: Phundahl <https://github.com/Phundahl>
    description: A brutalist, keyboard-centric terminal user interface for Tailscale
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - tailscale
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/tailtui/LICENSE
      - src: contrib/tailtui.toml.tpl
        dst: /usr/share/tailtui/tailtui.toml.tpl
      - src: README.md
        dst: /usr/share/doc/tailtui/README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
