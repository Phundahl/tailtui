name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # Allow running the suite by hand, e.g. to sanity-check before tagging a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch/PR; a stale run has nothing to say.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Honor the toolchain pinned in go.mod rather than drifting with
          # whatever "stable" happens to mean on release day.
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are out of date — run 'go mod tidy' and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The View layer is testable without a TTY, so the whole suite runs
      # headless. -race catches the async tea.Cmd paths (status/ping polling).
      - name: Test
        run: go test -race ./...

  # Enforce the standing pseudonym rule (CLAUDE.md, Phase 26.2) mechanically.
  # It was broken twice without review catching it: test fixtures pasted from
  # live daemon output, and a commit authored with a real-name address.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit-identity check can see the PR's commits;
          # the default shallow clone would hide them.
          fetch-depth: 0

      - name: Privacy guard
        env:
          # On a PR, scan only what the PR adds. On a push to main there is no
          # base to diff against, so the file checks still run and the identity
          # check is skipped (an empty range leaves it unset).
          PRIVACY_CHECK_COMMIT_RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || '' }}
        run: ./scripts/privacy-check.sh

  # Catch .goreleaser.yaml errors here rather than on a tag push, where the
  # only symptom is a failed release job after the tag already exists.
  goreleaser-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check
